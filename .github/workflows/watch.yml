name: 합창 취소표 감시

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:
    inputs:
      test:
        description: "현재 잔여석으로 테스트 카카오톡 메시지 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 잔여석 확인
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python3 watch.py ${{ inputs.test && '--test' || '' }}

      - name: 상태 저장
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "seat-watch-bot"
            git config user.email "seat-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "잔여석 상태 갱신"
            git push
          fi
